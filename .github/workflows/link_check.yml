# This action checks for broken links
name: Check Links

on:
  push:
  pull_request:
  schedule:
    - cron: "00 00 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 🔗 Check Links
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          fail: true
          args: --config .github/workflows/lychee.toml './**/*.md'
